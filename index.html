<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ডক্টর পোর্টফোলিও</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/js-yaml/4.1.0/js-yaml.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-50 text-gray-800">

    <!-- Navigation -->
    <nav class="bg-white shadow-md sticky top-0 z-50">
        <div class="container mx-auto px-6 py-4 flex justify-between items-center">
            <a href="#" class="text-2xl font-bold text-blue-600">HealthCare</a>
            <div class="hidden md:flex space-x-8">
                <a href="#home" class="hover:text-blue-600">হোম</a>
                <a href="#services" class="hover:text-blue-600">সেবাসমূহ</a>
                <a href="#contact" class="bg-blue-600 text-white px-4 py-2 rounded-lg hover:bg-blue-700">অ্যাপয়েন্টমেন্ট</a>
            </div>
        </div>
    </nav>

    <!-- Hero Section -->
    <section id="home" class="py-20 bg-blue-50">
        <div class="container mx-auto px-6 flex flex-col md:flex-row items-center">
            <div class="md:w-1/2 mb-10 md:mb-0">
                <h1 id="site-title" class="text-4xl md:text-5xl font-bold mb-4">লোড হচ্ছে...</h1>
                <p id="hero-text" class="text-lg mb-6">আপনার তথ্য আপডেট করা হচ্ছে।</p>
                <a href="#contact" class="bg-blue-600 text-white px-8 py-3 rounded-full text-lg shadow-lg hover:bg-blue-700">যোগাযোগ করুন</a>
            </div>
            <div class="md:w-1/2 flex justify-center">
                <div class="w-64 h-64 bg-blue-200 rounded-full overflow-hidden border-4 border-white shadow-xl">
                    <img id="doctor-img" src="https://via.placeholder.com/400" alt="Doctor" class="w-full h-full object-cover">
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-gray-900 text-white py-10 text-center">
        <p>&copy; ২০২৬ ডক্টর পোর্টফোলিও।</p>
    </footer>

    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>

    <script>
        // এই ফাংশনটি ফাইলের উপরের ডাটা (Frontmatter) পড়বে
        async function loadContent() {
            try {
                const response = await fetch(window.location.href);
                const text = await response.text();
                
                // Frontmatter আলাদা করা (--- এর মাঝখানের অংশ)
                const match = text.match(/^---\s*([\s\S]*?)\s*---/);
                if (match) {
                    const data = jsyaml.load(match[1]);
                    
                    // তথ্যগুলো আপডেট করা
                    if (data.title) document.getElementById('site-title').innerText = data.title;
                    if (data.hero_text) document.getElementById('hero-text').innerText = data.hero_text;
                    if (data.image) document.getElementById('doctor-img').src = data.image;
                }
            } catch (e) {
                console.error("ডাটা লোড করতে সমস্যা হয়েছে", e);
            }
        }
        window.onload = loadContent;
    </script>
</body>
</html>
