backend:
  name: git-gateway
  branch: main # আপনার GitHub ব্রাঞ্চের নাম

media_folder: "images/uploads" # আপলোড করা ছবি এখানে জমা হবে
public_folder: "/images/uploads"

collections:
  - name: "pages"
    label: "Pages"
    files:
      - file: "index.html"
        label: "Home Page"
        name: "home"
        fields:
          - {label: "Title", name: "title", widget: "string"}
          - {label: "Hero Text", name: "hero_text", widget: "text"}
          - {label: "Doctor Image", name: "image", widget: "image"}
