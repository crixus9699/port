backend:
  name: git-gateway
  branch: main # আপনার GitHub branch নাম (সাধারণত main বা master)

media_folder: "images" # ছবিগুলো যেখানে সেভ হবে
public_folder: "images"

collections:
  - name: "pages"
    label: "Pages"
    files:
      - label: "Home Page"
        name: "home"
        file: "index.html" # এটিই আমাদের মূল ফাইল
        format: "frontmatter" # YAML Frontmatter ফরম্যাট ব্যবহার করবে
        fields:
          - { label: "Page Title", name: "title", widget: "string" }
          - { label: "Hero Headline", name: "hero_headline", widget: "string" }
          - { label: "Hero Subtext", name: "hero_subtext", widget: "text" }
          - { label: "Doctor Profile Image", name: "doctor_image", widget: "image" }
          - { label: "Emergency Contact", name: "emergency_contact", widget: "string" }
          - { label: "Patients Served Count", name: "patients_served", widget: "string" }
          - { label: "Experience Years", name: "experience_years", widget: "string" }
